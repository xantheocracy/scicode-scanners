name: scicode_verified-failure-classification-smoke

packages:
  - inspect-scout==0.5.2

transcripts:
  sources:
    - eval_set_id: scicode-verified-default--tu1flh8tik8bh6l2
  filter:
    limit: 1
    where:
      - transcript_id: aazXhZLeLoXNgA6SuYqW2e

scanners:
  - package: "scicode-scanners @ git+https://github.com/xantheocracy/scicode-scanners.git@failure-classification-scanner"
    name: scicode_scanners
    items:
      - name: failure_classification
        args:
          implementation: scicode_verified
          generated_token_budget: 8192
          finalization_reserve: 1536
          reasoning_effort: high
          smoke_only: true

models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/z-ai/glm-5.3
        args:
          config:
            max_retries: 0
            extra_body:
              reasoning:
                effort: high

max_transcripts: 1
