name: scicode_verified-failure-classification-smoke

packages:
  - inspect-scout==0.5.2

transcripts:
  sources:
    - eval_set_id: scicode-verified-default--tu1flh8tik8bh6l2
  filter:
    limit: 1
    where:
      - transcript_id: BQqvcbeZrr2FACZLszQqsh

scanners:
  - package: "scicode-scanners @ git+https://github.com/xantheocracy/scicode-scanners.git@8bdb356cf1726f787017fe1d8b3963f3af6e0a30"
    name: scicode_scanners
    items:
      - name: failure_classification
        args:
          implementation: scicode_verified
          generated_token_budget: 32768
          finalization_reserve: 8192
          per_call_tokens: 4096
          tool_rounds: 12
          reasoning_effort: high
          dry_run: false

models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/z-ai/glm-5.3
        args:
          config:
            max_retries: 0
            extra_body:
              reasoning:
                effort: high

max_transcripts: 1
