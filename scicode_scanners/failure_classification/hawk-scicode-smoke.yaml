name: scicode-failure-classification-smoke

packages:
  - inspect-scout==0.5.2

transcripts:
  sources:
    - eval_set_id: scicode-default-max-6nsnsp7trfmhbofk
  filter:
    limit: 1
    where:
      - transcript_id: 6KaZBFP2RjaqsiqbFMPN3A

scanners:
  - package: "scicode-scanners @ git+https://github.com/xantheocracy/scicode-scanners.git@8bdb356cf1726f787017fe1d8b3963f3af6e0a30"
    name: scicode_scanners
    items:
      - name: failure_classification
        args:
          implementation: scicode
          generated_token_budget: 32768
          finalization_reserve: 8192
          per_call_tokens: 4096
          tool_rounds: 12
          reasoning_effort: high
          dry_run: false

models:
  - package: openai
    name: openrouter
    items:
      - name: openrouter/z-ai/glm-5.3
        args:
          config:
            max_retries: 0
            extra_body:
              reasoning:
                effort: high

max_transcripts: 8
