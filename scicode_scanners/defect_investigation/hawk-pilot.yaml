# Use Hawk's deployment-pinned Inspect version; do not override with a recent PyPI release.
# Uses the failure-classification-scanner branch; push local changes before launching.
{
  "name": "scicode-defect-investigation-glm-pilot",
  "packages": [
    "inspect-scout==0.5.2",
    "inspect-k8s-sandbox==0.6.1"
  ],
  "tasks": [
    {
      "package": "scicode-scanners @ git+https://github.com/xantheocracy/scicode-scanners.git@failure-classification-scanner",
      "name": "scicode_scanners",
      "items": [
        {
          "name": "scicode_defect_investigation",
          "args": {
            "implementation": "scicode",
            "sandbox_type": "k8s",
            "problem_ids": [
              "5",
              "13",
              "21",
              "58",
              "76"
            ],
            "generated_token_budget": 100000,
            "finalization_reserve": 5000,
            "model_call_limit": 150,
            "tool_call_limit": 140,
            "time_limit": 3600,
            "reasoning_effort": "high",
            "per_call_tokens": 8000
          }
        },
        {
          "name": "scicode_defect_investigation",
          "args": {
            "implementation": "scicode_verified",
            "sandbox_type": "k8s",
            "problem_ids": [
              "5",
              "13",
              "21",
              "58",
              "76"
            ],
            "generated_token_budget": 100000,
            "finalization_reserve": 5000,
            "model_call_limit": 150,
            "tool_call_limit": 140,
            "time_limit": 3600,
            "reasoning_effort": "high",
            "per_call_tokens": 8000
          }
        }
      ]
    }
  ],
  "models": [
    {
      "package": "openai",
      "name": "openrouter",
      "items": [
        {
          "name": "openrouter/z-ai/glm-5.3",
          "args": {
            "config": {
              "max_retries": 0,
              "extra_body": {
                "reasoning": {
                  "effort": "high"
                }
              }
            }
          }
        }
      ]
    }
  ],
  "epochs": 1,
  "retry_attempts": 0,
  "max_retries": 0,
  "max_samples": 1,
  "runner": {
    "cpu": "2",
    "memory": "4Gi"
  },
  "max_tasks": 1
}
